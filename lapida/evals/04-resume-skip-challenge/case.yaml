schema_version: '1.1'
name: 04-resume-skip-challenge
description: Resumes an idea file at CHALLENGE, "avança" fills the phase as assumptions and stops at the gate.
tags:
- resume
- gate
context:
  scaffold_script: fixture.sh
execution:
  prompt: /lapida ideas/estoque-feirantes.md avança
  max_turns: 25
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Edit
  - Write
graders:
- name: challenge-header
  type: regex
  target: last_message
  pattern: CHALLENGE
- name: no-refine-round
  type: regex
  target: last_message
  pattern: REFINE\s*·\s*\S+\s+\d+
  match: not_contains
- name: criteria
  type: llm
  weight: 3
  criteria: 'PASS if it resumes at CHALLENGE (not EXPLORE), fills the phase with

    recommended answers marked as assumption/premissa, shows the phase summary with

    a riskiest assumption, a pre-mortem and the doing-nothing alternative, and asks

    for the ok before opening REFINE.

    FAIL if it re-asks EXPLORE questions, proposes a solution, or opens REFINE

    without waiting.'
