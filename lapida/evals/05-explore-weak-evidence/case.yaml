schema_version: '1.1'
name: 05-explore-weak-evidence
description: EXPLORE weighs evidence by The Mom Test and writes a job statement that names no product.
tags:
- explore
- methods
context:
  scaffold_script: fixture.sh
execution:
  prompt: /lapida ideas/lista-de-compras.md avança
  max_turns: 25
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Edit
  - Write
graders:
- name: job-statement
  type: regex
  target: last_message
  pattern: quando\b.{3,200}\bquero\b.{3,200}\bpara\b
  flags: is
- name: no-challenge-round
  type: regex
  target: last_message
  pattern: CHALLENGE\s*·\s*\S+\s+\d+
  match: not_contains
- name: criteria
  type: llm
  weight: 3
  criteria: 'PASS if the EXPLORE summary tags "cinco amigos disseram que usariam" and

    "a ideia é genial" as weak (or none) evidence and explains why — a hypothetical

    future or a compliment, not past behavior — while the hour spent weekly is at

    most weak because it is the author''s own experience; fills a job statement

    ("Quando…, quero…, para…") that does not mention an app or recipes app; fills

    the real problem without a solution, a specific audience and the current

    workaround, marking guessed answers as assumption/premissa; and asks for the ok

    before opening CHALLENGE.

    FAIL if any of those three evidence items is tagged strong, the job statement

    names the product, or it opens CHALLENGE without waiting.'
