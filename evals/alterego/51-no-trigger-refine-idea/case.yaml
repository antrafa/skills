schema_version: '1.1'
name: 51-no-trigger-refine-idea
description: "Refining an idea without the explicit ask goes to the normal flow, not the persona."
tags:
- trigger
execution:
  prompt: 'Refina essa ideia: um app que lembra o time de atualizar o status das tarefas.'
  max_turns: 25
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: skill-not-loaded
  type: regex
  target: trace
  pattern: Threefold Reference DNA
  match: not_contains
- name: skill-tool-not-called
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?alterego"'
  min: 0
  max: 0
  arm: both
