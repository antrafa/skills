schema_version: '1.1'
name: 06-no-trigger-on-mr-mention
description: The persona does not activate on a loose MR mention.
tags:
- trigger
- smoke
execution:
  prompt: 'Review this merge request for me: !42'
  max_turns: 25
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: skill-not-loaded
  type: regex
  target: trace
  pattern: Threefold Reference DNA
  match: not_contains
- name: skill-tool-not-called
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?alterego"'
  min: 0
  max: 0
  arm: both
