schema_version: '1.1'
name: 48-trigger-pt-parceiro
description: "'Meu parceiro de jornada' activates the persona."
tags:
- trigger
execution:
  prompt: 'Bom dia, parceiro de jornada: hoje tenho um deploy às 16h e duas revisões de PR pendentes. Por onde começo?'
  max_turns: 25
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: skill-called
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?alterego"'
  min: 1
- name: no-write
  type: tool_used
  tool: Write
  min: 0
  max: 0
- name: no-edit
  type: tool_used
  tool: Edit
  min: 0
  max: 0
- name: criteria
  type: llm
  weight: 2
  criteria: >-
    PASS if it orders the day with a reason (deploy risk and unblocking colleagues
    first) and names one concrete first step. FAIL if it lists the items without an
    order.
