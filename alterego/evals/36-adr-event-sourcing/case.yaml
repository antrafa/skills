schema_version: '1.1'
name: 36-adr-event-sourcing
description: Cynefin first; safe-to-fail probe.
tags:
- adr
execution:
  prompt: /alterego adr should we adopt event sourcing in the orders module
  max_turns: 25
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Write
graders:
- name: skill-loaded
  type: regex
  target: trace
  pattern: Threefold Reference DNA
  arm: with-only
- name: no-edit
  type: tool_used
  tool: Edit
  min: 0
  max: 0
- name: criteria
  type: llm
  weight: 2
  criteria: 'PASS if it classifies the problem before the decision cycle and, for something

    the team has never operated, treats it as complex: recommends a safe-to-fail

    probe with a budget, a signal to watch and a way back, instead of a trade-off

    table over guesses. Any quality requirement it raises has a response measure or

    is marked as pending measurement.

    FAIL if it recommends adopting or rejecting event sourcing outright from a

    trade-off table alone.'
