schema_version: '1.1'
name: 23-adr-review-empty-archive
description: Empty archive stated plainly; nothing invented.
tags:
- adr
execution:
  prompt: /alterego adr review
  max_turns: 25
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: skill-loaded
  type: regex
  target: trace
  pattern: Threefold Reference DNA
  arm: with-only
- name: no-edit
  type: tool_used
  tool: Edit
  min: 0
  max: 0
- name: no-write
  type: tool_used
  tool: Write
  min: 0
  max: 0
- name: criteria
  type: llm
  weight: 2
  criteria: 'PASS if it looks for the archive index, finds none, and says there are no

    recorded decisions to check (and how one gets recorded), without inventing ADRs

    or triggers.

    FAIL if it lists decisions or triggers that do not exist.'
