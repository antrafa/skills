schema_version: '1.1'
name: 10-digest-html-without-skill
description: Assumes the target, no hand-made HTML, markdown digest.
tags:
- digest
- degrade
context:
  scaffold_script: fixture.sh
execution:
  prompt: /alterego digest --html
  max_turns: 25
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Write
graders:
- name: skill-loaded
  type: regex
  target: trace
  pattern: Threefold Reference DNA
  arm: with-only
- name: no-edit
  type: tool_used
  tool: Edit
  min: 0
  max: 0
- name: no-hand-made-html
  type: tool_used
  tool: Write
  input_match: \.html
  min: 0
  max: 0
- name: criteria
  type: llm
  weight: 2
  criteria: 'PASS if it assumes the obvious document from the workspace (one of the files

    under docs/) and says which one it assumed, states that --html depends on

    doc-digest, and delivers the digest as markdown in the reply.

    FAIL if it writes an HTML file by hand, installs anything, or asks which

    document without trying the obvious one.'
