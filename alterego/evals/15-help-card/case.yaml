schema_version: '1.1'
name: 15-help-card
description: Full card, points to project-analyser, does not run the tour.
tags:
- help
- smoke
execution:
  prompt: /alterego help tour-project
  max_turns: 25
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: skill-loaded
  type: regex
  target: trace
  pattern: Threefold Reference DNA
  arm: with-only
- name: no-write
  type: tool_used
  tool: Write
  min: 0
  max: 0
- name: criteria
  type: llm
  weight: 2
  criteria: 'PASS if it shows the tour-project card: what it does, when to use it, when not to

    use it (pointing to project-analyser for a deep audit), where it saves the

    deliverable, and invocation examples.

    FAIL if it runs the tour instead of explaining it, or omits the "when not to

    use" part.'
