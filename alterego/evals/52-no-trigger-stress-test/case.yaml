schema_version: '1.1'
name: 52-no-trigger-stress-test
description: "Stress-testing a plan without the explicit ask does not activate the persona."
tags:
- trigger
execution:
  prompt: 'Stress-test this plan: we move the monolith database to read replicas next sprint.'
  max_turns: 25
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: skill-not-loaded
  type: regex
  target: trace
  pattern: Threefold Reference DNA
  match: not_contains
- name: skill-tool-not-called
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?alterego"'
  min: 0
  max: 0
  arm: both
