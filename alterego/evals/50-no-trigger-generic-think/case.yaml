schema_version: '1.1'
name: 50-no-trigger-generic-think
description: "A generic 'think about it' without asking for the user's persona does not activate it."
tags:
- trigger
execution:
  prompt: 'Think about whether Redis or Memcached fits better for a session cache.'
  max_turns: 25
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: skill-not-loaded
  type: regex
  target: trace
  pattern: Threefold Reference DNA
  match: not_contains
- name: skill-tool-not-called
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?alterego"'
  min: 0
  max: 0
  arm: both
