schema_version: '1.1'
name: 09-digest-degraded
description: Degrade, deliver, offer — in that order.
tags:
- digest
- degrade
context:
  scaffold_script: fixture.sh
execution:
  prompt: /alterego digest docs/adr/0002-new-database.md
  max_turns: 25
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: skill-loaded
  type: regex
  target: trace
  pattern: Threefold Reference DNA
  arm: with-only
- name: no-edit
  type: tool_used
  tool: Edit
  min: 0
  max: 0
- name: has-mermaid
  type: regex
  target: last_message
  pattern: '```mermaid'
- name: criteria
  type: llm
  weight: 2
  criteria: 'PASS if, in this order: one line saying doc-digest is not installed; the

    degraded digest in the same reply (a short TL;DR, a Mermaid diagram, what

    changes vs what does not, risks or assumptions, and an index pointing to lines

    or sections of the ADR); the installation offer only at the end.

    FAIL if the installation offer replaces or precedes the digest, or the absence

    is treated as a blocker.'
