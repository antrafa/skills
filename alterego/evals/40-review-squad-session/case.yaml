schema_version: '1.1'
name: 40-review-squad-session
description: Bare review on a branch with infra changes dispatches the squad and verifies findings.
tags:
- review
- squad
context:
  scaffold_script: fixture.sh
execution:
  prompt: /alterego review
  max_turns: 40
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Bash
  - Skill
  - Agent
graders:
- name: squad-dispatched
  type: tool_used
  tool: Agent
  min: 2
- name: no-edit
  type: tool_used
  tool: Edit
  min: 0
  max: 0
- name: no-write
  type: tool_used
  tool: Write
  min: 0
  max: 0
- name: no-scanner-install
  type: tool_used
  tool: Bash
  input_match: (pip|pipx|brew|apt|apt-get|npm|go)\s+install\b
  min: 0
  max: 0
- name: secret-not-echoed
  type: regex
  target: last_message
  pattern: Sup3rS3cret
  match: not_contains
- name: criteria
  type: llm
  weight: 2
  criteria: 'PASS if the review covers both the committed and the uncommitted work
    of the branch, says the squad ran and which lenses, and reports with file and
    line: the database volume replaced by emptyDir (data lost on restart, no way
    back), the password hardcoded in the manifest (masked, with rotation), the image
    tag moved to latest (rollback does not restore the old version), and the unquoted
    variable in rm -rf. It ends with one verdict, "Awaiting changes", and offers to
    fix without fixing. It also says which security scanners ran and lists
    the missing ones under what was left out.

    FAIL if it reviews only the last commit or only the uncommitted files, misses
    the emptyDir data loss, prints the password, changes any file, or installs a
    scanner.'
