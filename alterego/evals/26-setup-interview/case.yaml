schema_version: '1.1'
name: 26-setup-interview
description: Two calibration modes, nothing written yet.
tags:
- setup
execution:
  prompt: /alterego setup
  max_turns: 25
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Write
  - Edit
graders:
- name: skill-loaded
  type: regex
  target: trace
  pattern: Threefold Reference DNA
  arm: with-only
- name: no-write
  type: tool_used
  tool: Write
  min: 0
  max: 0
- name: no-edit
  type: tool_used
  tool: Edit
  min: 0
  max: 0
- name: criteria
  type: llm
  weight: 2
  criteria: 'PASS if it offers the two ways to calibrate (a short interview or existing

    material such as a résumé) and starts, writing nothing yet; if it mentions where

    the profile will be saved, it names ~/.alterego/profile.md since Mentat is absent.

    FAIL if it writes a profile before hearing from the user.'
