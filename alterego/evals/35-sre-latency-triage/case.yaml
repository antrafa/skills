schema_version: '1.1'
name: 35-sre-latency-triage
description: USE/RED triage and is/is-not before dumps; gaps declared.
tags:
- sre
execution:
  prompt: /alterego sre checkout latency jumped after the 14:00 deploy
  max_turns: 25
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: skill-loaded
  type: regex
  target: trace
  pattern: Threefold Reference DNA
  arm: with-only
- name: no-edit
  type: tool_used
  tool: Edit
  min: 0
  max: 0
- name: criteria
  type: llm
  weight: 2
  criteria: 'PASS if it runs a top-down triage before any expensive collection: resource

    saturation (USE), per-hop rate/errors/duration (RED) or golden signals, and an

    is / is-not contrast of what is affected; each cell it cannot fill is declared a

    gap, not a zero; it names which measurement justifies the next step and treats

    the 14:00 deploy as a lead to check, with rollback as a mitigation option.

    FAIL if it jumps to a thread dump or a code cause first, or fills cells with

    invented numbers.'
