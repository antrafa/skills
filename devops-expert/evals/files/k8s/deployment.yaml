apiVersion: apps/v1
kind: Deployment
metadata:
  name: relatorios-backend
  namespace: clientea-hml
spec:
  replicas: 2
  selector:
    matchLabels:
      app: relatorios-backend
  template:
    metadata:
      labels:
        app: relatorios-backend
    spec:
      containers:
        - name: relatorios-backend
          image: registry.example.com/relatorios-backend:3.8.2
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 1
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
